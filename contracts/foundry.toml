[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "0g-agent-nft/=lib/0g-agent-nft/contracts/"
]

[rpc_endpoints]
galileo   = "https://evmrpc-testnet.0g.ai"
aristotle = "https://evmrpc.0g.ai"

[etherscan]
galileo   = { key = "${ETHERSCAN_API_KEY}", url = "https://chainscan-galileo.0g.ai/api", chain = 16602 }
aristotle = { key = "${ETHERSCAN_API_KEY}", url = "https://chainscan.0g.ai/api",         chain = 16661 }
